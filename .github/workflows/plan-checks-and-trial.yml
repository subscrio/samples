name: Verify C# plan checks and trial transition

on:
  push:
    paths:
      - 'examples/replace-hardcoded-plan-checks-csharp/**'
      - 'examples/trial-to-free-subscriptions-csharp/**'
      - '.github/workflows/plan-checks-and-trial.yml'
  pull_request:
    paths:
      - 'examples/replace-hardcoded-plan-checks-csharp/**'
      - 'examples/trial-to-free-subscriptions-csharp/**'
      - '.github/workflows/plan-checks-and-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localdb:
    runs-on: windows-latest
    strategy:
      matrix:
        sample: [replace-hardcoded-plan-checks-csharp, trial-to-free-subscriptions-csharp]
    defaults:
      run:
        working-directory: examples/${{ matrix.sample }}
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start SQL Server LocalDB
        run: |
          $instances = sqllocaldb info
          if ($LASTEXITCODE -ne 0) { throw 'SQL Server LocalDB is unavailable.' }
          if ($instances -notcontains 'MSSQLLocalDB') {
            sqllocaldb create MSSQLLocalDB
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the LocalDB instance.' }
          }
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'Could not start LocalDB.' }
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode --source https://api.nuget.org/v3/index.json
      - name: Verify entitlement behavior
        run: dotnet run --no-restore
