name: Verify C# web feature access
on:
  push:
    paths:
      - 'examples/feature-access-control-csharp/**'
      - '.github/workflows/feature-access-control-csharp.yml'
  pull_request:
    paths:
      - 'examples/feature-access-control-csharp/**'
      - '.github/workflows/feature-access-control-csharp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/feature-access-control-csharp
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start LocalDB
        run: |
          $instances = sqllocaldb info
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB is unavailable.' }
          if ($instances -notcontains 'MSSQLLocalDB') { sqllocaldb create MSSQLLocalDB }
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB did not start.' }
      - run: dotnet restore --locked-mode --source https://api.nuget.org/v3/index.json
      - run: dotnet run --no-restore -- --verify
      - name: Verify a second clean run
        run: dotnet run --no-restore -- --verify
