name: Verify Stripe price ID feature access examples
on:
  push:
    paths:
      - 'examples/stripe-price-id-feature-access/**'
      - '.github/workflows/stripe-price-id-feature-access.yml'
  pull_request:
    paths:
      - 'examples/stripe-price-id-feature-access/**'
      - '.github/workflows/stripe-price-id-feature-access.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nextjs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: feedbackdesk_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: examples/stripe-price-id-feature-access/typescript
    env:
      DATABASE_URL: postgresql://postgres:local-only@localhost:5432/feedbackdesk_demo
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/stripe-price-id-feature-access/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run seed
      - name: Verify HTTP access decisions
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/next-sample.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/demo/export/legacy-team >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke.mjs
  aspnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: feedbackdesk_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: examples/stripe-price-id-feature-access/dotnet
    env:
      DATABASE_URL: Host=localhost;Port=5432;Database=feedbackdesk_demo;Username=postgres;Password=local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --locked-mode
      - run: dotnet run --no-restore -- --verify
