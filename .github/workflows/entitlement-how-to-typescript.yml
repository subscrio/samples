name: Verify TypeScript entitlement how-to samples
on:
  push:
    paths:
      - 'examples/scheduled-subscription-activation-typescript/**'
      - 'examples/subscription-feature-bundles-typescript/**'
      - 'examples/billing-period-usage-metering-typescript/**'
      - 'examples/shared-credit-wallet-typescript/**'
      - 'examples/combine-subscription-entitlements-typescript/**'
      - 'examples/one-time-app-purchase-typescript/**'
      - 'examples/prepaid-background-jobs-typescript/**'
      - 'examples/stripe-subscription-renewals/**'
      - '.github/workflows/entitlement-how-to-typescript.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample:
          - scheduled-subscription-activation-typescript
          - subscription-feature-bundles-typescript
          - billing-period-usage-metering-typescript
          - shared-credit-wallet-typescript
          - combine-subscription-entitlements-typescript
          - one-time-app-purchase-typescript
          - prepaid-background-jobs-typescript
          - stripe-subscription-renewals/typescript
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sample
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: sample
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: examples/${{ matrix.sample }}
    env:
      DATABASE_URL: postgresql://sample:local-ci-only@localhost:5432/sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
